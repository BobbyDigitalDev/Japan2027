<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2027 Japan Spring Trip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: a two-week strip (Mon to Sun, twice) leads the page; the selected day's detail sits directly under it. */
:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --ink: #1c2340;
  --muted: #5f6682;
  --line: #dde1ec;
  --accent: #a8325e;      /* ume plum, the wedding */
  --on-accent: #ffffff;
  --stay: #2f5d8a;        /* hotel stay */
  --sat: #2b5fa8;         /* Japanese calendars print Saturday blue */
  --sun: #b3303a;         /* and Sunday red */
  --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  --body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151f; --surface: #1b1f2d; --ink: #e8eaf3; --muted: #9aa1bb; --line: #2c3246;
    --accent: #e0709a; --on-accent: #1d0c15; --stay: #7fb0e0; --sat: #86b2f0; --sun: #f08a90;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151f; --surface: #1b1f2d; --ink: #e8eaf3; --muted: #9aa1bb; --line: #2c3246;
  --accent: #e0709a; --on-accent: #1d0c15; --stay: #7fb0e0; --sat: #86b2f0; --sun: #f08a90;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.55;
}
.page {
  max-width: 1040px;
  margin: 0 auto;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* Header */
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; }
.head h1 { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 4.4vw, 38px); line-height: 1.15; margin: 0; text-wrap: balance; }
.head .range { color: var(--muted); margin: 4px 0 0; }
.countdown { font-variant-numeric: tabular-nums; color: var(--muted); margin: 0; }
.countdown strong { color: var(--accent); font-family: var(--display); font-size: 22px; font-weight: 700; margin-right: 4px; }

/* Calendar */
.cal-wrap { display: flex; flex-direction: column; gap: 10px; }
.cal-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.cal-title h2 { font-family: var(--display); font-size: 20px; font-weight: 700; margin: 0; }
.cal-title h2 span { color: var(--muted); font-weight: 500; margin-left: 8px; font-size: 16px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 13px; margin: 0; padding: 0; list-style: none; }
.legend li { display: flex; align-items: center; gap: 6px; }
.swatch { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.swatch.stay { width: 18px; height: 5px; border-radius: 3px; background: var(--stay); }

.dow, .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dow div { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 0 8px; display: flex; justify-content: space-between; }
.dow .sat { color: var(--sat); }
.dow .sun { color: var(--sun); }

.day {
  position: relative;
  appearance: none;
  font: inherit;
  color: inherit;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  min-height: 112px;
  padding: 8px 8px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  cursor: pointer;
  min-width: 0;
}
.day:hover { border-color: var(--muted); }
.day:focus-visible { outline: 2px solid var(--stay); outline-offset: 2px; }
.day[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.day .num { font-family: var(--display); font-size: 24px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.day .num small { font-family: var(--body); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.day.sat .num { color: var(--sat); }
.day.sun .num { color: var(--sun); }
.day .tags { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tag { font-size: 12px; line-height: 1.3; overflow-wrap: anywhere; }
.tag.stay { color: var(--stay); font-weight: 500; }
.tag.open { color: var(--muted); }
.tag b { font-variant-numeric: tabular-nums; }

/* The wedding day is the one filled cell */
.day.wedding { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.day.wedding .num, .day.wedding .num small, .day.wedding .tag { color: var(--on-accent); }
.day.wedding[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); border-color: var(--accent); }

/* Hotel stay band along the bottom edge of the cell */
.band { position: absolute; bottom: 5px; height: 5px; background: var(--stay); border-radius: 3px; left: 8px; right: 8px; }
.band.start { left: 50%; right: -7px; border-radius: 3px 0 0 3px; }
.band.mid { left: -1px; right: -1px; border-radius: 0; }
.band.end { left: -1px; right: 50%; border-radius: 0 3px 3px 0; }
.day.wedding .band { background: var(--on-accent); opacity: 0.85; }

/* Day detail */
.detail { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.detail h3 { font-family: var(--display); font-size: 20px; font-weight: 700; margin: 0; }
.detail h3 span { color: var(--muted); font-weight: 500; font-size: 15px; margin-left: 8px; }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.items li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 4px 16px; padding: 10px 0; border-top: 1px solid var(--line); }
.items .when { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; padding-top: 2px; }
.items .what { font-weight: 700; }
.items .meta { color: var(--muted); font-size: 14px; margin: 2px 0 0; }
.items a { color: var(--stay); text-underline-offset: 3px; overflow-wrap: anywhere; }
.empty { color: var(--muted); margin: 0; }

@media (max-width: 640px) {
  .dow, .cal { gap: 4px; }
  .dow div { padding: 0; justify-content: center; }
  .dow .en { display: none; }
  .day { min-height: 64px; padding: 6px 4px 14px; align-items: center; gap: 4px; }
  .day .num { font-size: 19px; }
  .day .num small { display: block; font-size: 9px; margin: 0 0 2px; text-align: center; }
  .day .tags { align-items: center; }
  .tag { font-size: 10px; text-align: center; }
  .tag.open { display: none; }
  .tag .long { display: none; }
  .band { left: 4px; right: 4px; }
  .band.start { right: -5px; }
  .items li { grid-template-columns: 1fr; }
}
@media (min-width: 641px) { .tag .short { display: none; } }

@media print {
  body { background: #fff; }
  .day, .detail { break-inside: avoid; }
}
</style>

</head>
<body style="margin:0">
<main class="page">
  <header class="head">
    <div>
      <h1>2027 Japan Spring Trip</h1>
      <p class="range">First two weeks of March 2027 · built around a wedding in Osaka</p>
    </div>
    <p class="countdown" id="countdown">Wedding: Sun, March 7 at 11:00 JST</p>
  </header>

  <section class="cal-wrap" aria-labelledby="cal-h">
    <div class="cal-title">
      <h2 id="cal-h">March 2027<span>3月 · Feb 28 to Mar 13</span></h2>
      <ul class="legend">
        <li><span class="swatch"></span>Wedding day</li>
        <li><span class="swatch stay"></span>Hotel stay, Osaka</li>
      </ul>
    </div>
    <div class="dow" aria-hidden="true">
      <div class="sun"><span class="en">Sun</span><span>日</span></div>
      <div><span class="en">Mon</span><span>月</span></div>
      <div><span class="en">Tue</span><span>火</span></div>
      <div><span class="en">Wed</span><span>水</span></div>
      <div><span class="en">Thu</span><span>木</span></div>
      <div><span class="en">Fri</span><span>金</span></div>
      <div class="sat"><span class="en">Sat</span><span>土</span></div>
    </div>
    <div class="cal" id="cal"></div>
  </section>

  <section class="detail" id="detail" aria-live="polite"></section>
</main>

<script>
(function () {
  var DOW = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var DOW_JP = ["日曜日", "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日"];
  // Day keys: 0 is Sunday, February 28; 1 to 13 are the March dates.
  function label(d) { return d === 0 ? "February 28" : "March " + d; }
  var HOTEL = "Hotel Hankyu Gran Respire Osaka";

  // Only confirmed plans live here. Every other day stays open.
  var plans = {
    6: {
      band: "start",
      tags: [{ cls: "stay", long: "Check in, Osaka", short: "In" }],
      items: [{ when: "Check-in", what: HOTEL, meta: "Two nights, March 6 to 8. Hotel cost: ¥55,400." }]
    },
    7: {
      band: "mid", wedding: true,
      tags: [{ cls: "", long: "<b>11:00</b> Wedding", short: "<b>11:00</b>" }],
      items: [
        { when: "11:00 JST", what: "Wedding in Osaka", meta: 'Venue: <a href="https://www.bleu-grace-osaka.jp/" target="_blank" rel="noopener">bleu-grace-osaka.jp</a>' },
        { when: "Overnight", what: HOTEL, meta: "Second night of the stay." }
      ]
    },
    8: {
      band: "end",
      tags: [{ cls: "stay", long: "Check out", short: "Out" }],
      items: [{ when: "Check-out", what: HOTEL, meta: "End of the Osaka stay." }]
    }
  };

  var cal = document.getElementById("cal");
  var detail = document.getElementById("detail");
  var buttons = {};

  function showDay(d) {
    var i = d % 7;
    var p = plans[d];
    var html = "<h3>" + DOW[i] + ", " + label(d) + "<span>" + DOW_JP[i] + "</span></h3>";
    if (p) {
      html += '<ul class="items">' + p.items.map(function (it) {
        return '<li><div class="when">' + it.when + '</div><div><div class="what">' + it.what +
               '</div><p class="meta">' + it.meta + "</p></div></li>";
      }).join("") + "</ul>";
    } else {
      html += '<p class="empty">Nothing planned yet. This day is open.</p>';
    }
    detail.innerHTML = html;
    for (var k in buttons) buttons[k].setAttribute("aria-pressed", String(Number(k) === d));
  }

  for (var d = 0; d <= 13; d++) {
    (function (d) {
      var i = d % 7;
      var p = plans[d];
      var b = document.createElement("button");
      b.type = "button";
      b.id = "day-" + d;
      b.className = "day" + (i === 6 ? " sat" : "") + (i === 0 ? " sun" : "") + (p && p.wedding ? " wedding" : "");
      b.setAttribute("aria-pressed", "false");
      b.setAttribute("aria-label", DOW[i] + ", " + label(d) + (p ? ", " + p.items[0].what : ", open"));
      var tags = p
        ? p.tags.map(function (t) {
            return '<span class="tag ' + t.cls + '"><span class="long">' + t.long + '</span><span class="short">' + t.short + "</span></span>";
          }).join("")
        : '<span class="tag open">Open</span>';
      b.innerHTML = '<span class="num">' + (d === 0 ? "<small>Feb</small>28" : (d === 1 ? "<small>Mar</small>1" : d)) + '</span><span class="tags">' + tags + "</span>" +
                    (p && p.band ? '<span class="band ' + p.band + '"></span>' : "");
      b.addEventListener("click", function () { showDay(d); });
      buttons[d] = b;
      cal.appendChild(b);
    })(d);
  }

  showDay(7);

  // Days until the ceremony: 11:00 JST on March 7, 2027 is 02:00 UTC.
  var days = Math.ceil((Date.UTC(2027, 2, 7, 2, 0) - Date.now()) / 86400000);
  if (days > 0) {
    document.getElementById("countdown").innerHTML =
      "<strong>" + days + "</strong>" + (days === 1 ? "day" : "days") + " to the wedding · Sun, March 7 at 11:00 JST";
  }
})();
</script>
</body>
</html>
